services:
  postgres:
    image: postgres:18-alpine
    container_name: proquant-postgres
    environment:
      POSTGRES_DB: proquant
      POSTGRES_USER: proquant
      POSTGRES_PASSWORD: proquant_dev_password
    ports:
      - "5438:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proquant"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
