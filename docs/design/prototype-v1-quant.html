<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QuantLab Pro · 机构级量化投研终端 · 高保真设计稿 V2.0</title>
<style>
:root{
  --f-sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;
  --f-mono:'SF Mono','JetBrains Mono','Menlo','Consolas',ui-monospace,monospace;
  --prd:#FACC15;--prd-fg:#141414;
}
[data-theme=dark]{
  --bg:#090C10;--bg1:#0E1217;--bg2:#131920;--bg3:#1A212A;
  --line:#1D252F;--line2:#2A3441;--grid:#161D26;
  --tx:#E4E9EF;--tx2:#9AA5B1;--tx3:#5E6A77;
  --up:#EF5350;--dn:#26A69A;--sig:#38BDF8;--warn:#F59E0B;--pass:#3FB97F;--mem:#A78BFA;
  --up-bg:rgba(239,83,80,.12);--dn-bg:rgba(38,166,154,.12);--sig-bg:rgba(56,189,248,.09);--warn-bg:rgba(245,158,11,.11);--pass-bg:rgba(63,185,127,.11);--mem-bg:rgba(167,139,250,.08);
  --sig-line:rgba(56,189,248,.38);--mem-line:rgba(167,139,250,.38);
  --on-sig:#03121C;
  --syn-kw:#38BDF8;--syn-fn:#C4D3E3;--syn-str:#D9B26A;--syn-num:#F0A35E;--syn-var:#A78BFA;
  --shadow:0 8px 24px rgba(0,0,0,.45);
}
[data-theme=light]{
  --bg:#ECE9E1;--bg1:#FAF8F3;--bg2:#F2EFE8;--bg3:#E6E2D8;
  --line:#DAD5C9;--line2:#C2BBAC;--grid:#E9E5DC;
  --tx:#121417;--tx2:#454B53;--tx3:#80848A;
  --up:#D32F2F;--dn:#00897B;--sig:#0369A1;--warn:#B45309;--pass:#18794E;--mem:#6D28D9;
  --up-bg:rgba(211,47,47,.08);--dn-bg:rgba(0,137,123,.08);--sig-bg:rgba(3,105,161,.07);--warn-bg:rgba(180,83,9,.08);--pass-bg:rgba(24,121,78,.08);--mem-bg:rgba(109,40,217,.06);
  --sig-line:rgba(3,105,161,.35);--mem-line:rgba(109,40,217,.3);
  --on-sig:#FFFFFF;
  --syn-kw:#0369A1;--syn-fn:#1F2933;--syn-str:#8A5A00;--syn-num:#B45309;--syn-var:#6D28D9;
  --shadow:0 8px 24px rgba(40,30,10,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font:12px/1.45 var(--f-sans);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1}
.mono,.n,code,pre,.kv,input,select{font-variant-numeric:tabular-nums}
.mono,.n,code,pre{font-family:var(--f-mono)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg text{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2);border:2px solid var(--bg1)}::-webkit-scrollbar-track{background:transparent}
.c-up{color:var(--up)}.c-dn{color:var(--dn)}.c-sig{color:var(--sig)}.c-warn{color:var(--warn)}.c-pass{color:var(--pass)}.c-3{color:var(--tx3)}.c-2{color:var(--tx2)}

/* ---------- Command Chrome ---------- */
.chrome{height:44px;display:flex;align-items:center;gap:12px;padding:0 10px 0 0;border-bottom:1px solid var(--line);background:var(--bg1);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:7px;width:200px;padding-left:12px;height:100%;border-right:1px solid var(--line);flex:none}
.brand b{font-size:13px;font-weight:680;letter-spacing:0;white-space:nowrap}
.ver{font:600 8.5px var(--f-mono);letter-spacing:.02em;color:var(--sig);border:1px solid var(--sig-line);padding:1px 3px;border-radius:2px;white-space:nowrap}
.ctx{display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow:hidden}
.fld{display:flex;align-items:center;height:26px;border:1px solid var(--line2);border-radius:2px;background:var(--bg2);position:relative;white-space:nowrap}
.fld>span{padding:0 7px;color:var(--tx3);font:600 9.5px var(--f-mono);letter-spacing:.08em;border-right:1px solid var(--line);height:100%;display:flex;align-items:center}
.fld select{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:var(--tx);font:550 11.5px var(--f-sans);padding:0 26px 0 8px;height:100%;cursor:pointer;outline:none}
.fld select option{background:var(--bg2);color:var(--tx)}
.fld .chv{position:absolute;right:7px;top:6px;pointer-events:none;color:var(--tx3)}
.fld .v{padding:0 8px;font:11px var(--f-mono);color:var(--tx2)}
.rt{display:flex;align-items:center;gap:8px;flex:none}
.hb{display:flex;align-items:center;gap:7px;height:26px;padding:0 9px;border:1px solid var(--line2);border-radius:2px;font:10.5px var(--f-mono);color:var(--tx2);white-space:nowrap}
.hb b{color:var(--pass);font-weight:600}
.pulse{width:6px;height:6px;background:var(--pass);box-shadow:0 0 0 0 var(--pass);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,185,127,.55)}70%{box-shadow:0 0 0 6px rgba(63,185,127,0)}100%{box-shadow:0 0 0 0 rgba(63,185,127,0)}}
.tg{height:26px;padding:0 9px;border:1px solid var(--line2);border-radius:2px;font-size:11px;color:var(--tx2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.tg:hover{color:var(--tx);border-color:var(--tx3)}
.tg.on{color:var(--prd-fg);background:var(--prd);border-color:var(--prd);font-weight:600}
.ib{width:26px;height:26px;border:1px solid var(--line2);border-radius:2px;display:grid;place-items:center;color:var(--tx2)}
.ib:hover,.ib.on{color:var(--sig);border-color:var(--sig-line)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:2px;overflow:hidden;flex:none}
.seg button{padding:0 8px;height:24px;font-size:10.5px;color:var(--tx3);border-right:1px solid var(--line2);display:flex;align-items:center;gap:5px;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--bg3);color:var(--tx);box-shadow:inset 0 -1.5px 0 var(--sig)}
.chrome .seg button{height:24px}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:200px minmax(0,1fr) 360px;height:calc(100% - 44px)}
body.bot-off .app{grid-template-columns:200px minmax(0,1fr) 0}
body.bot-off .bot{display:none}
.main{overflow-y:auto;overflow-x:hidden;padding:12px 14px 28px;min-width:0}
.stack>*+*{margin-top:10px}

/* ---------- Nav ---------- */
.nav{border-right:1px solid var(--line);background:var(--bg1);display:flex;flex-direction:column;min-height:0}
.nsec{padding:12px 12px 6px;font:600 9px var(--f-mono);letter-spacing:.14em;color:var(--tx3);display:flex;justify-content:space-between}
.ni{display:grid;grid-template-columns:16px 1fr auto;column-gap:9px;align-items:center;padding:6px 10px 6px 10px;border-left:2px solid transparent;color:var(--tx2);cursor:pointer;width:100%;text-align:left}
.ni:hover{background:var(--bg2);color:var(--tx)}
.ni.on{background:var(--bg2);color:var(--tx);border-left-color:var(--sig)}
.ni.on svg{color:var(--sig)}
.ni b{font-weight:560;font-size:12px;white-space:nowrap}
.ni small{grid-column:2;font:10px var(--f-mono);color:var(--tx3)}
.ni em{font:600 9px var(--f-mono);color:var(--tx3);font-style:normal;grid-row:1/3;grid-column:3;border:1px solid var(--line2);padding:0 3px;border-radius:2px}
.ni svg{grid-row:1/3}
.xl{flex:1;overflow-y:auto;min-height:0}
.xi{display:block;padding:6px 12px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.xi:hover{background:var(--bg2)}
.xi.on{background:var(--sig-bg)}
.xi div{display:flex;justify-content:space-between;align-items:center}
.xi span{font:10.5px var(--f-mono);color:var(--tx2)}
.xi small{display:block;font-size:10.5px;color:var(--tx3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nfoot{border-top:1px solid var(--line);padding:8px 12px;font:10px/1.7 var(--f-mono);color:var(--tx3)}
.nfoot b{color:var(--tx2);font-weight:500}

/* ---------- Common ---------- */
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.crumb{font:10px var(--f-mono);color:var(--tx3);letter-spacing:.06em;display:flex;gap:6px;align-items:center}
.crumb b{color:var(--sig);font-weight:600}
.vh h1{font-size:17px;font-weight:660;letter-spacing:.005em;margin-top:2px;white-space:nowrap}
.vh p{font-size:11px;color:var(--tx3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vh-act{display:flex;gap:6px;align-items:center;flex:none}
.panel{background:var(--bg1);border:1px solid var(--line);border-radius:2px;min-width:0;position:relative}
.ph{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.pt{font-weight:620;font-size:11.5px}
.ps{color:var(--tx3);font:10px var(--f-mono)}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.pb{padding:10px}
.pb.flush{padding:0}
.cv{width:100%;position:relative}
.cv svg{display:block}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tag{display:inline-flex;align-items:center;gap:4px;font:600 9.5px/1 var(--f-mono);padding:3px 5px;border-radius:2px;letter-spacing:.03em;white-space:nowrap;border:1px solid transparent}
.tag.pass{color:var(--pass);background:var(--pass-bg);border-color:color-mix(in srgb,var(--pass) 30%,transparent)}
.tag.warn{color:var(--warn);background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 32%,transparent)}
.tag.fail{color:var(--up);background:var(--up-bg);border-color:color-mix(in srgb,var(--up) 32%,transparent)}
.tag.info{color:var(--sig);background:var(--sig-bg);border-color:var(--sig-line)}
.tag.mute{color:var(--tx2);background:var(--bg2);border-color:var(--line2)}
.btn{height:26px;padding:0 10px;border:1px solid var(--line2);border-radius:2px;font-size:11px;color:var(--tx);background:var(--bg2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--sig)}
.btn.pri{background:var(--sig);border-color:var(--sig);color:var(--on-sig);font-weight:620}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:22px;padding:0 7px;font-size:10.5px}
.btn.warnb{border-color:color-mix(in srgb,var(--warn) 45%,transparent);color:var(--warn);background:var(--warn-bg)}
.prd{display:none;font:700 9px/1 var(--f-mono);color:var(--prd-fg);background:var(--prd);padding:3px 4px;border-radius:1px;letter-spacing:.02em;white-space:nowrap;vertical-align:middle}
body.prd-on .prd{display:inline-flex}
body.prd-on .panel{outline:1px dashed color-mix(in srgb,var(--prd) 45%,transparent);outline-offset:-1px}
.lg{display:flex;flex-wrap:wrap;gap:4px 10px;font:10px var(--f-mono);color:var(--tx3);align-items:center}
.lg i{display:inline-block;width:10px;height:2px;margin-right:4px;vertical-align:middle}
.lg i.bx{height:8px;width:8px}

/* ---------- KPI ---------- */
.kpis{display:grid;border:1px solid var(--line);background:var(--bg1);border-radius:2px}
.k8{grid-template-columns:repeat(8,minmax(0,1fr))}.k5{grid-template-columns:repeat(5,minmax(0,1fr))}.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:7px 10px 8px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child,.k5 .kpi:nth-child(5n){border-right:0}
.k5.two .kpi:nth-child(-n+5){border-bottom:1px solid var(--line)}
.kl{font-size:10.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{font:520 17px/1.25 var(--f-mono);margin-top:2px;letter-spacing:-.01em;white-space:nowrap;border-radius:1px}
.kv small{font-size:11px;color:var(--tx3);margin-left:2px}
.ks{display:flex;align-items:center;gap:5px;font:10px var(--f-mono);color:var(--tx3);white-space:nowrap;overflow:hidden;margin-top:3px}
.chg{animation:chg 1s ease-out}
@keyframes chg{0%{background:var(--sig-bg);color:var(--sig)}100%{background:transparent}}
.gstrip{display:flex;flex-wrap:wrap;gap:6px}
.gs{display:flex;align-items:center;gap:7px;padding:5px 9px;border:1px solid var(--line);border-left-width:2px;background:var(--bg1);font-size:11px;color:var(--tx2);border-radius:2px}
.gs.pass{border-left-color:var(--pass)}.gs.warn{border-left-color:var(--warn)}.gs.fail{border-left-color:var(--up)}
.gs b{font:600 10px var(--f-mono)}

/* ---------- Alpha ---------- */
.ftabs{display:flex;border-bottom:1px solid var(--line);overflow:hidden}
.ftab{padding:7px 12px 6px;border-right:1px solid var(--line);text-align:left;color:var(--tx3);position:relative;min-width:0;flex:1}
.ftab span{font-size:11px;display:block;white-space:nowrap}
.ftab em{font-style:normal;font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftab:hover{color:var(--tx2);background:var(--bg2)}
.ftab.on{color:var(--tx);background:var(--bg)}
.ftab.on::after{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--sig)}
.ftab.on span{color:var(--sig)}
.defg{display:grid;grid-template-columns:minmax(0,1fr) 318px}
.ed{background:var(--bg);font:11.5px/19px var(--f-mono);padding:8px 0;border-right:1px solid var(--line);overflow:hidden;min-height:150px}
.ln{display:flex;white-space:pre}
.ln i{width:34px;text-align:right;padding-right:12px;color:var(--tx3);font-style:normal;user-select:none;flex:none;opacity:.7}
.ln span{overflow:hidden;text-overflow:ellipsis}
.tk-c{color:var(--tx3);font-style:italic}.tk-s{color:var(--syn-str)}.tk-n{color:var(--syn-num)}.tk-k{color:var(--syn-kw);font-weight:600}.tk-f{color:var(--syn-fn);font-weight:600}.tk-v{color:var(--syn-var)}
.edm{display:flex;gap:12px;padding:5px 10px;border-top:1px solid var(--line);border-right:1px solid var(--line);font:10px var(--f-mono);color:var(--tx3);background:var(--bg1)}
.pipe{padding:9px 10px;display:flex;flex-direction:column;gap:8px}
.ttl{font:600 9.5px var(--f-mono);letter-spacing:.1em;color:var(--tx3);display:flex;align-items:center;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px 0 7px;border:1px solid var(--line2);border-radius:2px;font-size:11px;color:var(--tx3);background:var(--bg)}
.chip .cb{width:10px;height:10px;border:1px solid var(--tx3);position:relative;flex:none}
.chip.on{color:var(--tx);border-color:var(--sig-line);background:var(--sig-bg)}
.chip.on .cb{background:var(--sig);border-color:var(--sig)}
.chip.on .cb::after{content:'';position:absolute;left:2.5px;top:0;width:3px;height:6px;border:solid var(--on-sig);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.chip:hover{border-color:var(--sig)}
.mtr{display:grid;grid-template-columns:62px 1fr 52px;align-items:center;gap:8px;font-size:10.5px;color:var(--tx2);height:16px}
.mtb{height:6px;background:var(--bg3);position:relative}
.mtb .mz{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--tx3)}
.mtb .lim{position:absolute;top:-3px;bottom:-3px;width:0;border-left:1px dashed var(--warn);opacity:.7}
.mtb b{position:absolute;top:0;bottom:0;transition:all .35s}
.mtr em{font:10.5px var(--f-mono);font-style:normal;text-align:right}

/* ---------- Tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl th{font:600 9.5px var(--f-mono);letter-spacing:.05em;color:var(--tx3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--bg1)}
.tbl td{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;height:28px}
.tbl tr:last-child td{border-bottom:0}
.tbl .n,.tbl th.n{text-align:right;font-family:var(--f-mono)}
.tbl tbody tr:hover td{background:var(--bg2)}
.tbl tr.sel td{background:var(--sig-bg)}
.tbl tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--sig)}
.tbl tr.click{cursor:pointer}
.tbl .sub{color:var(--tx3);font-size:10.5px}
.tbl.dense td{height:26px;padding:4px 8px}
.bar-in{display:inline-block;height:4px;background:var(--sig);vertical-align:middle;margin-left:6px;opacity:.8}

/* ---------- Models ---------- */
.mg{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:10px}
.gate-row{display:grid;grid-template-columns:92px 1fr 40px;align-items:center;gap:8px;height:20px;font-size:10.5px}
.gate-row .gb{height:8px;background:var(--bg3);position:relative}
.gate-row .gb b{position:absolute;left:0;top:0;bottom:0}
.gate-row .gb i{position:absolute;top:-4px;bottom:-4px;border-left:1.5px solid var(--up)}
.gate-row em{font:10.5px var(--f-mono);font-style:normal;text-align:right}
.gate-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx2)}
.gate-row.on span{color:var(--tx);font-weight:600}
.gsec{font:600 9.5px var(--f-mono);letter-spacing:.08em;color:var(--tx3);margin:8px 0 4px;display:flex;justify-content:space-between}
.verdict{margin-top:10px;border:1px solid var(--line);background:var(--bg);padding:8px 9px}
.vrow{display:flex;justify-content:space-between;align-items:center;font-size:11px;height:22px;color:var(--tx2)}
.vrow b{font:11px var(--f-mono);color:var(--tx)}

/* ---------- Portfolio ---------- */
.pfg{display:grid;grid-template-columns:292px minmax(0,1fr);gap:10px}
.sl{padding:7px 0 6px;border-bottom:1px solid var(--line)}
.sl:last-of-type{border-bottom:0}
.slh{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--tx2)}
.slh b{font:600 12px var(--f-mono);color:var(--sig)}
.sls{display:flex;justify-content:space-between;font-size:9.5px;color:var(--tx3);margin-top:-1px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;display:block;--p:50%}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,var(--sig) var(--p),var(--line2) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:15px;margin-top:-6.5px;background:var(--bg1);border:1.5px solid var(--sig);border-radius:1px}
input[type=range]::-moz-range-track{height:2px;background:var(--line2)}
input[type=range]::-moz-range-progress{height:2px;background:var(--sig)}
input[type=range]::-moz-range-thumb{width:8px;height:14px;background:var(--bg1);border:1.5px solid var(--sig);border-radius:1px}
.code{background:var(--bg);border:1px solid var(--line);font:10.5px/17px var(--f-mono);padding:6px 8px;color:var(--tx2);white-space:pre;overflow:hidden;margin-top:8px}
.code .hl{color:var(--sig);font-weight:600}
.solv{display:flex;align-items:center;gap:6px;font:10px var(--f-mono);color:var(--tx3);margin-top:8px}

/* ---------- Backtest / Data / Shadow ---------- */
.bg2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px}
.attr{display:flex;height:22px;border:1px solid var(--line);margin:4px 0 8px}
.attr div{display:flex;align-items:center;justify-content:center;font:600 10px var(--f-mono);color:var(--on-sig);white-space:nowrap;overflow:hidden;transition:flex .3s}
.guard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.gc{border:1px solid var(--line);border-left:2px solid var(--pass);background:var(--bg);padding:7px 9px}
.gc .gh{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600}
.gc .gv{font:600 15px var(--f-mono);margin-top:2px;color:var(--pass)}
.gc p{font-size:10.5px;line-height:1.45;color:var(--tx3);margin-top:1px}
.ph .lg{flex-wrap:nowrap}
.st{display:inline-flex;align-items:center;gap:5px;font:600 10px var(--f-mono)}
.st i{width:6px;height:6px;display:inline-block}
.sg2{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:10px}
